<div id="address_edit">
    <div class="mt-field" ng-hide="address.IsCustEditable == false">
        <label for="Autocomplete">{{'Quick Address' | r | xlat}}</label>
        <input type="text" id="Autocomplete" class="form-control" details="addressobj" placeholder="{{'Enter a location' | r | xlat}}" ng-autocomplete ng-model="addressresult" />
    </div>
    <form name="addressEdit" ng-submit="save()">
        <div class="mt-field">
            <label ng-class="{'required': address.IsCustEditable != false}">{{('Address' | r) + ' ' + ('Name' | r) | xlat}}</label>
            <input name="addressname" class="form-control" type="text" ng-model="address.AddressName" placeholder="{{('Address' | r) + ' ' + ('Name' | r) | xlat}}" autocomplete="off" ng-required="address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
        </div>

        <div class="mt-checkout-shipping-fields">
            <div class="mt-field">
                <label ng-show="address.FirstName || address.IsBilling" ng-class="{required: address.IsBilling && address.IsCustEditable != false}">{{('First' | r) + ' ' + ('Name' | r) | xlat}}</label>
                <input name="firstname" class="form-control" type="text" ng-model="address.FirstName" placeholder="{{('First' | r) + ' ' + ('Name' | r) | xlat}}" autocomplete="off" ng-required="address.IsBilling && address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
            </div>
            <div class="mt-field">
                <label ng-show="address.LastName || address.IsBilling" ng-class="{required: address.IsBilling && address.IsCustEditable != false}">{{('Last' | r) + ' ' + ('Name' | r) | xlat}}</label>
                <input name="lastname" class="form-control" type="text" ng-model="address.LastName" placeholder="{{('Last' | r) + ' ' + ('Name' | r) | xlat}}" autocomplete="off" ng-required="address.IsBilling && address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
            </div>
        </div>

        <div class="mt-field">
            <label ng-show="address.CompanyName">{{('Company' | r) + ' ' + ('Name' | r) | xlat}}</label>
            <input name="companyname" class="form-control" type="text" ng-model="address.CompanyName" autocomplete="off" placeholder="{{('Company' | r) + ' ' + ('Name' | r) | xlat}}" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
        </div>

        <div class="mt-field">
            <label ng-class="{'required': address.IsCustEditable != false}">{{'Address Line 1' | r | xlat}}</label>
            <input name="street1" class="form-control" type="text" ng-model="address.Street1" placeholder="{{'Address Line 1' | r | xlat}}" autocomplete="off" ng-required="address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
        </div>
        <div class="mt-field">
            <label ng-show="address.Street2">{{'Address Line 2' | r | xlat}}</label>
            <input name="street2" class="form-control" type="text" ng-model="address.Street2" placeholder="{{'Address Line 2' | r | xlat}}" autocomplete="off" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
        </div>

        <div class="mt-checkout-shipping-fields">
            <div class="mt-field">
                <label ng-class="{'required': address.IsCustEditable != false}">{{'City' | r | xlat}}</label>
                <input name="city" class="form-control" type="text" ng-model="address.City" placeholder="{{'City' | r | xlat}}" autocomplete="off" ng-required="address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
            </div>
            <div class="mt-field" ng-show="!hasStates()">
                <label ng-class="{required: !hasStates && address.IsCustEditable != false}">{{'State' | r | xlat}}</label>
                <input ng-show="!hasStates()" class="form-control" type="text" ng-model="address.State" placeholder="{{'State' | r | xlat}}" autocomplete="off" ng-required="!hasStates() && address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
            </div>
            <div class="mt-field" ng-show="hasStates()">
                <label ng-class="{required: hasStates && address.IsCustEditable != false}">{{'State' | r | xlat}}</label>
                <select ng-show="hasStates()" class="form-control" ng-options="state.value as state.label for state in states | filter:country" ng-model="address.State" placeholder="{{'State' | r | xlat}}" ng-required="hasStates() && address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-change="autoSaveIfValid()">
                </select>
            </div>
        </div>

        <div class="mt-checkout-shipping-fields">
            <div class="mt-field">
                <label ng-class="{required: hasStates() && address.IsCustEditable != false}">{{'Zip' | r | xlat}}</label>
                <input name="zip" class="form-control" type="text" ng-model="address.Zip" placeholder="{{'Zip' | r | xlat}}" autocomplete="off" ng-required="hasStates() && address.IsCustEditable != false"
                       ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
            </div>
            <div class="mt-field">
                <label ng-class="{'required': address.IsCustEditable != false}">{{'Country' | r | xlat}}</label>
                <select name="country" class="form-control" ng-options="country.value as country.label for country in countries" ng-model="address.Country" placeholder="{{'Country' | r | xlat}}" ng-required="address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-change="autoSaveIfValid()"></select>
            </div>
        </div>

        <div class="mt-field">
            <label ng-show="isPhoneRequired()" ng-class="{required: isPhoneRequired()}">{{'Phone' | r | xlat}}</label>
            <input name="phone" class="form-control" type="text" ng-model="address.Phone" placeholder="{{'Phone' | r | xlat}}" autocomplete="off" ng-required="isPhoneRequired() && address.IsCustEditable != false" ng-disabled="address.IsCustEditable == false" ng-blur="autoSaveIfValid()" />
        </div>

        <div class="mt-checkout-orderfields">
            <label class="mt-checkout-auto-id" ng-show="user.Permissions.contains('CreateShipToAddress')">
                <input name="isShipping" type="checkbox" ng-model="address.IsShipping" ng-required="!address.IsBilling" ng-disabled="address.IsCustEditable == false" ng-change="autoSaveIfValid()" />
                {{'Save to Shipping Address Book' | r | xlat}}
            </label>
            <label class="mt-checkout-auto-id" ng-show="user.Permissions.contains('CreateBillToAddress')">
                <input name="isBilling" type="checkbox" ng-model="address.IsBilling" ng-required="!address.IsShipping" ng-disabled="address.IsCustEditable == false" ng-change="autoSaveIfValid()" />
                {{'Save to Billing Address Book' | r | xlat}}
            </label>
        </div>
        <p class="mt-checkout-payment-warning" ng-show="addressEdit.isShipping.$invalid || addressEdit.isBilling.$invalid">
            {{'An address must be saved to the shipping, billing or both address books.' | r | xlat}}
        </p>
        <p class="mt-checkout-payment-warning" ng-show="objectExists">{{'An address with that name already exists. Please specify another name' | r | xlat}}</p>

        <div class="mt-checkout-shipto-toggle">
            <button ng-if="(user.Permissions.contains('CreateShipToAddress') || user.Permissions.contains('CreateBillToAddress')) && address.IsCustEditable" class="mt-header-btn" ng-click="delete()" type="button">{{'Delete' | r | xlat}}</button>
            <button class="mt-header-btn" type="button" ng-click="cancel()">{{'Cancel' | r | xlat}}</button>
        </div>
    </form>
</div>
