<div class="mt-checkout-card">
    <h2 class="mt-checkout-card-title">{{'Approval' | r}} {{'Rules' | r}}</h2>
    <approvalrulelist order="currentOrder"></approvalrulelist>
    <div class="mt-field" ng-if="user.Permissions.contains('EditApprovalOrder') && currentOrder.Status == 'AwaitingApproval'">
        <textarea class="form-control" ng-model="currentOrder.ApprovalComment" ng-attr-placeholder="{{'Approval' | r}} {{'Comments' | r}}"></textarea>
    </div>
</div>
