<form name="giftcard_redeem" ng-submit="redeemGiftCard()" class="mt-giftcard-form">
    <label ng-show="giftcard.Code">{{'Gift Card Code' | r | xlat}}</label>
    <div class="mt-field-row">
        <input type="text" ng-model="giftcard.Code" placeholder="{{'Gift Card Code' | r | xlat}}" autocomplete="off" />
        <button type="submit" class="mt-btn-accent"><i class="fa fa-check"></i></button>
    </div>
    <div ng-show="giftcard.Balance" class="mt-login-alert">
        {{'A gift card' | xlat}}, <strong>{{giftcard.Code}}</strong>, {{'with a balance of' | xlat}} <strong>{{giftcard.Balance | culturecurrency}}</strong> {{'has been attached to your account and will be available during the billing step of the checkout process while a balance remains' | xlat}}.
    </div>
</form>
