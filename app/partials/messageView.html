<section class="mt-messages">
    <div class="mt-container mt-messages-inner">
        <div id="451_msg_read" ng-hide="composing" class="mt-checkout-card">
            <h1 class="mt-pdp-title">{{message.Subject}}</h1>
            <p class="mt-pdp-meta">{{'Date' | r | xlat}}: {{message.DateSent | date:user.Culture.DateFormat.long}}</p>
            <p class="mt-pdp-meta">{{'To' | r | xlat}}: {{message.ToName}}</p>
            <p class="mt-pdp-meta">{{'From' | r | xlat}}: {{message.FromName}}</p>
            <pre class="mt-messages-body">{{message.Body}}</pre>

            <div class="mt-messages-actions">
                <button id="451_btn_del" ng-click="delete($event)" type="button" class="mt-cart-remove-link">{{'Delete' | r | xlat}}</button>
                <button id="451_btn_reply" ng-show="canReply()" type="button" class="mt-header-btn" ng-click="reply()">{{'Reply' | r | xlat}}</button>
                <button id="451_btn_ok" ng-click="ok()" type="button" class="mt-btn-accent">{{'OK' | r | xlat}}</button>
            </div>
        </div>

        <div id="451_msg_reply" ng-show="composing" class="mt-checkout-card">
            <h2 class="mt-checkout-card-title">{{'Reply' | r | xlat}}</h2>

            <p class="mt-pdp-meta" ng-show="message.ID">{{'To' | r | xlat}}: {{message.FromName}}</p>

            <div class="mt-field">
                <label>{{'Subject' | r | xlat}}</label>
                <input id="451_inp_subj" class="form-control" type="text" ng-model="message.Subject" autocomplete="off" />
            </div>
            <div class="mt-field">
                <label>{{'Body' | r | xlat}}</label>
                <textarea class="form-control" rows="10" id="451_inp_body" ng-model="message.Body"></textarea>
            </div>

            <div class="mt-messages-actions">
                <button type="button" id="451_btn_cancel" class="mt-header-btn" ng-click="cancel()">{{'Cancel' | r | xlat}}</button>
                <button type="button" id="451_btn_send" class="mt-btn-accent" ng-click="send($event)">{{'Send' | r | xlat}}</button>
            </div>
        </div>
    </div>
</section>
