<section class="mt-reports">
    <div class="mt-container mt-reports-inner">
        <h1 class="mt-pdp-title">{{('Saved' | r) + ' ' + ('Reports' | r) | xlat}}</h1>

        <div class="mt-checkout-card">
            <loadingindicator ng-show="displayLoadingIndicator"></loadingindicator>
            <div class="mt-reports-toolbar view-form-icon">
                <div class="input-group">
                    <label ng-show="searchTerm">{{'Search' | r | xlat}}</label>
                    <input class='form-control' type="text" placeholder="{{'Search' | r | xlat}}" ng-model="searchTerm" autocomplete="off" />
                    <i class="fa fa-search"></i>
                    <div class="input-group-btn">
                        <button class="mt-btn-accent dropdown-toggle" type="button" data-toggle="dropdown">
                            <span>{{('New' | r) + ' ' + ('Report' | r) | xlat}}</span>
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu pull-right mt-reports-new-menu" role="menu">
                            <li ng-repeat="(key,value) in Reports.AvailableTypes">
                                <a role="presentation" tabindex="-1" href="report/{{key}}">{{value | xlat}}</a>
                            </li>
                        </ul>
                    </div>
                 </div>
            </div>
            <div class="mt-report-table-wrap">
                <table class="mt-report-table">
                    <thead>
                        <tr>
                            <th class="mt-report-table-check"></th>
                            <th>{{'Name' | r | xlat}}</th>
                            <th>{{'Type' | r | xlat}}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="report in Reports | filter:{'Name': searchTerm}">
                            <td class="mt-report-table-check">
                                <input type="checkbox" ng-model="report.Selected" />
                            </td>
                            <td>
                                <a ng-href="{{'report/' + report.ID}}">{{report.Name}}</a>
                            </td>
                            <td>
                                {{report.ReportTypeName | xlat}}
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="mt-reports-footer">
                <button type="button" class="mt-header-btn" ng-click="deleteSelected($event)" ng-disabled="(Reports | filter:searchTerm | filter:{Selected:true}).length == 0">{{('Delete' | r) + ' ' +  ('Selected' | r) | xlat}}</button>
            </div>
            <div class="navbar-fixed-bottom">
                <div class="view-response-message alert-success text-center" alert-show="actionMessage">
                    <p>{{actionMessage | r | xlat}}</p>
                </div>
            </div>
        </div>
    </div>
</section>
