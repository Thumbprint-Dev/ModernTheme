<section class="mt-addresses">
    <loadingindicator ng-show="displayLoadingIndicator"></loadingindicator>
    <div class="mt-container mt-addresses-inner">
        <div class="mt-account-mobile-nav">
            <accountnavigation></accountnavigation>
        </div>
        <div class="mt-addresses-header">
            <span class="mt-eyebrow">{{'Account' | r | xlat}}</span>
            <h1 class="mt-pdp-title">{{'Addresses' | r | xlat}}</h1>
        </div>
        <div class="mt-checkout-card">
            <div class="mt-addresses-search">
                <form name="searchForm" ng-submit="search()">
                    <div class="input-group">
                        <input type="text" ng-model="searchTerm" class="form-control" placeholder="{{('Search' | r) + ' ' + ('Addresses' | r) | xlat}}" />
                        <div class="input-group-btn">
                            <button type="submit" class="mt-header-btn">{{'Search' | r | xlat}}</button>
                        </div>
                    </div>
                </form>
            </div>
            <div ng-show="!addresses.length > 0" class="mt-addresses-empty">
                <p class="mt-account-alert">{{'No' + ' ' + ('addresses' | rc) + ' ' + 'available' | xlat}}</p>
                <button type="button" class="mt-btn-accent" ng-click="newAddress($event)">{{'Add an' + ' ' + ('address' | rc) + ' ' + 'now' | xlat}}</button>
            </div>
            <div ng-show="addresses.length > 0">
                <div class="table-responsive mt-addresses-table-wrap">
                    <table class="table mt-addresses-table">
                        <tbody>
                        <tr>
                            <th><input type='checkbox' ng-click="checkAll($event)" /></th>
                            <th>{{'Name' | r}}</th>
                            <th>{{'City' | r}}</th>
                            <th>{{'State' | r}}</th>
                            <th>{{'Shipping' | r}}</th>
                            <th>{{'Billing' | r}}</th>
                        </tr>
                        <tr ng-repeat="address in addresses | paginate:(settings.currentPage-1) * settings.pageSize | limitTo:settings.pageSize">
                            <td><input type='checkbox' ng-model="address.Selected" ng-show="address.IsCustEditable" /></td>
                            <td><a ng-href="address/{{address.ID}}" class="mt-addresses-link">{{address.AddressName}}</a></td>
                            <td>{{address.City}}</td>
                            <td>{{address.State}}</td>
                            <td><i ng-class="{'fa fa-check': address.IsShipping }"></i></td>
                            <td><i ng-class="{'fa fa-check': address.IsBilling }"></i></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="mt-addresses-footer" ng-show="addresses.length > 0">
                <div ng-show="settings.listCount > settings.pageSize">
                    <pagination page="settings.currentPage" max-size="8" rotate="false" boundary-links="true" total-items="settings.listCount"
                                items-per-page="settings.pageSize" direction-links="true" previous-text="{{'Previous' | xlat}}" next-text="{{'Next' | xlat}}" first-text="{{'First' | xlat}}" last-text="{{'Last' | xlat}}"></pagination>
                </div>
                <button type="button" class="mt-header-btn" ng-click="deleteSelected($event)" ng-disabled="(addresses | filter:{Selected:true}).length == 0">{{('Delete' | r) + ' ' + ('Selected' | r) | xlat}}</button>
                <button ng-if="user.Permissions.contains('CreateShipToAddress') || user.Permissions.contains('CreateBillToAddress')" type="button" class="mt-btn-accent mt-addresses-new-btn" ng-click="newAddress($event)">{{('New' | r) + ' ' + ('Address' | r) | xlat}}</button>
            </div>
        </div>
    </div>
    <div class="navbar-fixed-bottom">
        <loadingindicator ng-show="displayLoadingIndicator"></loadingindicator>
        <div class="view-action-message alert-success" ng-show="actionMessage">{{actionMessage | r | xlat}}</div>
    </div>
</section>
